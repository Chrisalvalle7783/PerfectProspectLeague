name: Build Perfect Prospect v36 Exact APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          npm install
          npx expo install react-native-webview
      - name: Install exact approved v36
        run: |
          python3 - <<'PY'
          import urllib.request
          u='https://drive.usercontent.google.com/download?id=1pagnSymak3bNjom02hgYjlVjtlndbwr1&export=download&confirm=t'
          urllib.request.urlretrieve(u,'PerfectProspectLeague_v36_mobile.html')
          PY
          test $(wc -c < PerfectProspectLeague_v36_mobile.html) -gt 400000
      - name: Create exact WebView app
        run: |
          cat > App.js <<'EOF'
          import React from 'react';
          import { SafeAreaView, StyleSheet } from 'react-native';
          import { WebView } from 'react-native-webview';
          export default function App(){return <SafeAreaView style={s.root}><WebView source={{uri:'file:///android_asset/perfect_prospect_v36.html'}} originWhitelist={['*']} javaScriptEnabled domStorageEnabled allowFileAccess allowFileAccessFromFileURLs allowUniversalAccessFromFileURLs geolocationEnabled style={s.web}/></SafeAreaView>}
          const s=StyleSheet.create({root:{flex:1,backgroundColor:'#000'},web:{flex:1,backgroundColor:'#000'}});
          EOF
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Add v36 to Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp PerfectProspectLeague_v36_mobile.html android/app/src/main/assets/perfect_prospect_v36.html
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Package APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PerfectProspectLeague-v36-Exact.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PerfectProspectLeague-v36-Exact
          path: PerfectProspectLeague-v36-Exact.apk
          retention-days: 30
